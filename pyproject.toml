[project]
name = "pinecone-opensearch"
version = "0.1.0"
description = "OpenSearch drop-in client that translates queries and writes to the Pinecone Documents API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Pinecone Systems, Inc." }]
keywords = ["pinecone", "opensearch", "search", "vector", "hybrid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "pinecone>=10",
    "opensearch-py>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/pinecone-io/pinecone-opensearch"
Documentation = "https://github.com/pinecone-io/pinecone-opensearch#readme"
Repository = "https://github.com/pinecone-io/pinecone-opensearch"
Issues = "https://github.com/pinecone-io/pinecone-opensearch/issues"

[project.scripts]
pinecone-opensearch = "pinecone_opensearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinecone_opensearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.2.4",
]
